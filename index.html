<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幸運轉盤</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Theme color (Android / Chrome) -->
  <meta name="theme-color" content="#7b2fbe" />

  <!-- iOS PWA 支援 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="幸運轉盤" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Android / 通用 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="幸運轉盤" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Star decorations -->
  <div class="stars" aria-hidden="true">
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">✦</span>
    <span class="star">✧</span>
  </div>

  <h1>🎡 幸運轉盤 🎡</h1>

  <div class="layout">
    <!-- Wheel area -->
    <div class="wheel-area">
      <div class="wheel-wrapper">
        <div class="pointer">▼</div>
        <canvas id="wheel-canvas" width="500" height="500"></canvas>
        <div class="flash-overlay" id="flash-overlay"></div>
      </div>
      <button id="spin-btn" class="btn btn-spin">旋轉！</button>
      <div id="result" class="result hidden"></div>
    </div>

    <!-- Right column: config + history -->
    <div class="right-column">

      <!-- Config panel -->
      <div class="config-panel">
        <h2>⚙️ 設定</h2>

        <div class="config-row">
          <label for="item-count">選項數量</label>
          <input type="number" id="item-count" min="2" max="20" value="6" />
        </div>

        <div id="segments-list" class="segments-list"></div>

        <button id="apply-btn" class="btn btn-apply">套用</button>
      </div>

      <!-- History panel -->
      <div class="history-panel">
        <div class="history-header">
          <h2>📝 抽獎紀錄</h2>
          <button id="clear-history-btn" class="btn btn-clear">清除</button>
        </div>

        <div id="history-list" class="history-list">
          <p class="history-empty">還沒有紀錄喔！</p>
        </div>

        <div class="stats-section">
          <h3>📊 統計</h3>
          <div id="stats-list" class="stats-list"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="wheel.js"></script>

  <!-- Service Worker 註冊 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('[PWA] Service Worker 已註冊，範圍：', reg.scope))
          .catch(err => console.warn('[PWA] Service Worker 註冊失敗：', err));
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>幸運轉盤</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Theme color (Android / Chrome) -->
  <meta name="theme-color" content="#7b2fbe" />

  <!-- iOS PWA 支援 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="幸運轉盤" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Android / 通用 -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="幸運轉盤" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="top-bar-left">
      <button id="settings-btn" class="btn btn-settings">⚙️ 設定</button>
    </div>
    <div class="top-bar-center">
      <select id="theme-select" class="theme-select"></select>
    </div>
    <div class="top-bar-right">
      <button id="add-theme-btn" class="btn btn-add-theme">➕ 新增</button>
      <div class="top-bar-divider"></div>
      <button id="mode-toggle-btn" class="btn btn-mode">🪬 擲筊</button>
    </div>
  </div>

  <!-- Theme management modal -->
  <div id="mgmt-modal" class="mgmt-modal hidden" role="dialog" aria-modal="true">
    <div class="mgmt-modal-box">
      <div class="mgmt-header">
        <h3>🎯 主題管理</h3>
        <button id="mgmt-add-btn"   class="btn btn-mgmt-add">➕ 新增主題</button>
        <button id="mgmt-close-btn" class="btn btn-mgmt-close" aria-label="關閉">✕</button>
      </div>
      <div id="theme-cards" class="theme-cards"></div>
    </div>
  </div>

  <!-- Theme edit modal -->
  <div id="edit-modal" class="edit-modal hidden" role="dialog" aria-modal="true">
    <div class="edit-modal-box">
      <h3 id="edit-modal-title">新增主題</h3>
      <div class="edit-form">
        <div class="edit-name-row">
          <input type="text" id="edit-emoji" maxlength="2" value="⭐" class="edit-emoji-input" />
          <input type="text" id="edit-name" placeholder="主題名稱" class="edit-name-input" />
        </div>
        <div class="edit-items-header">
          <span>轉盤選項</span>
          <button id="edit-add-item-btn" class="btn btn-sm">➕ 新增選項</button>
        </div>
        <div id="edit-items-list" class="edit-items-list"></div>
      </div>
      <div class="edit-actions">
        <button id="edit-save-btn"   class="btn btn-apply">儲存</button>
        <button id="edit-cancel-btn" class="btn btn-clear">取消</button>
      </div>
    </div>
  </div>

  <!-- Star decorations -->
  <div class="stars" aria-hidden="true">
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">✦</span>
    <span class="star">✧</span>
    <span class="star">✦</span>
    <span class="star">✧</span>
  </div>

  <h1>🎡 幸運轉盤 🎡</h1>

  <div class="layout">
    <!-- Wheel area -->
    <div class="wheel-area">
      <div class="wheel-wrapper" id="wheel-view">
        <div class="pointer">▼</div>
        <canvas id="wheel-canvas" width="500" height="500"></canvas>
        <div class="flash-overlay" id="flash-overlay"></div>
      </div>
      <button id="spin-btn" class="btn btn-spin">旋轉！</button>
      <div id="result" class="result hidden"></div>

      <!-- 擲筊視圖（預設隱藏） -->
      <div id="jiaobei-view" class="jiaobei-view hidden">
        <div class="wheel-wrapper">
          <canvas id="jiaobei-canvas" width="500" height="500"></canvas>
        </div>
        <button id="throw-btn" class="btn btn-throw">擲筊！</button>
        <div id="jiaobei-result" class="jiaobei-result hidden"></div>
      </div>
    </div>

    <!-- Right column: history only -->
    <div class="right-column">
      <div class="history-panel">
        <div class="history-header">
          <h2 id="history-panel-title">📝 抽獎紀錄</h2>
          <button id="clear-history-btn" class="btn btn-clear">清除</button>
        </div>
        <div id="history-list" class="history-list">
          <p class="history-empty">還沒有紀錄喔！</p>
        </div>
        <div class="stats-section">
          <h3>📊 統計</h3>
          <div id="stats-list" class="stats-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="wheel.js"></script>

  <!-- Service Worker 註冊 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('[PWA] Service Worker 已註冊，範圍：', reg.scope))
          .catch(err => console.warn('[PWA] Service Worker 註冊失敗：', err));
      });
    }
  </script>
</body>
</html>
